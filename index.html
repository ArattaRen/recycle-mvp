<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Recycle Radar — Краснодарский край</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <style>
        body, html, #map { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
        .leaflet-popup-content { font-size: 14px; }
        .doc-links { position: absolute; bottom: 6px; left: 8px; z-index: 1000; background: rgba(255,255,255,.88); padding: 3px 9px; border-radius: 4px; font-size: 12px; }
        .doc-links a { color: #228be6; text-decoration: none; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="doc-links">
        <a href="offer.html">Оферта</a> · <a href="privacy.html">Политика ПДн</a> · <a href="disclaimer.html">Дисклеймер</a>
    </div>
    <script>
        // Инициализация карты (центр — Краснодарский край)
        var map = L.map('map').setView([45.04, 38.98], 7);
        
        // Подложка Esri (работает без API-ключа)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Тайлы © Esri | Точки: © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors (ODbL)'
        }).addTo(map);

        // Запрос к данным (файл points.json лежит рядом с картой)
        fetch('points.json')
            .then(response => response.json())
            .then(data => {
                var markers = L.markerClusterGroup();
                data.forEach(p => {
                    var color = p.status === 'GREEN' ? '#28a745' : (p.status === 'YELLOW' ? '#ffc107' : '#6c757d');
                    var m = L.circleMarker([p.lat, p.lon], {
                        radius: 10,
                        fillColor: color,
                        color: '#fff',
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).bindPopup(`<b>${p.name}</b><br>Принимают: ${p.accepted || 'уточняйте на месте'}${p.phone ? '<br>📞 <a href="tel:' + p.phone + '">' + p.phone + '</a>' : ''}<br>Цена: ${p.price} ₽/кг<br>Статус: ${p.status}`);
                    markers.addLayer(m);
                });
                map.addLayer(markers);
            })
            .catch(err => console.error("Ошибка API:", err));
    </script>
</body>
</html>
